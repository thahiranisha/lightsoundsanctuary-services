server:
  port: 8085

spring:
  application:
    name: santuary-map-service

  datasource:
    url: jdbc:postgresql://localhost:5435/mapdb
    username: mapadmin
    password: mappass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect