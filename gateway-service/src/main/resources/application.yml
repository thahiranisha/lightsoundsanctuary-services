server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: beacon-service
          uri: ${BEACON_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/beacons/**

        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/users/**

        - id: media-service
          uri: ${MEDIA_SERVICE_URI:http://localhost:8083}
          predicates:
            - Path=/api/media/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://localhost:8084}
          predicates:
            - Path=/api/notifications/**

        - id: sanctuary-map-service
          uri: ${SANCTUARY_MAP_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/map/**

jwt:
  secret: ${JWT_SECRET}

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET}